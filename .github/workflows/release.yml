name: Release Course Materials

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-lecture-13:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout student repository
      # ==================================================
      - name: Checkout student repository
        uses: actions/checkout@v5


      # ==================================================
      # 2. Clone private Lecture 13 repository
      # ==================================================
      - name: Clone Lecture 13 repository
        env:
          TOKEN: ${{ secrets.LECTURE_REPO_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${TOKEN}@github.com/Ikedichi-Azuh/Environmental-Statistics-Lecture-13-Plotting-and-Variable-importance.git \
            lecture13-source


      # ==================================================
      # 3. Set up Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ==================================================
      # 4. Install PyYAML
      # ==================================================
      - name: Install Python dependencies
        run: |
          pip install pyyaml


      # ==================================================
      # 5. Synchronize README and release materials
      # ==================================================
      - name: Release Lecture 13
        env:
          TZ: Europe/Berlin
        run: |

          python <<'PY'

          import shutil
          import yaml

          from pathlib import Path
          from datetime import datetime, date, time


          # ==================================================
          # CONFIGURATION
          # ==================================================

          lecture_number = 13

          source = Path("lecture13-source")
          destination = Path("Lecture-13")

          destination.mkdir(
              parents=True,
              exist_ok=True
          )


          # ==================================================
          # TEMPORARY TEST TIMES
          #
          # README is always available.
          #
          # 23:15 -> slides + teaching notes
          # 23:20 -> exercise question + data
          # 23:25 -> exercise solution
          # 23:26 -> homework question
          # ==================================================

          slides_time = time(23, 15)
          exercise_time = time(23, 20)
          solution_time = time(23, 25)
          homework_time = time(23, 26)


          # ==================================================
          # CURRENT BERLIN DATE AND TIME
          # ==================================================

          now = datetime.now()

          today = now.date()
          current_time = now.time()


          print("")
          print("==========================================")
          print("COURSE RELEASE CHECK")
          print("==========================================")
          print(f"Berlin date: {today}")
          print(f"Berlin time: {current_time}")
          print("==========================================")


          # ==================================================
          # READ SCHEDULE
          # ==================================================

          with open(
              "schedule.yml",
              "r",
              encoding="utf-8"
          ) as f:

              schedule = yaml.safe_load(f)


          lecture_dates = {
              int(lecture["number"]):
              date.fromisoformat(
                  str(lecture["date"])
              )
              for lecture in schedule["lectures"]
          }


          lecture_date = lecture_dates[
              lecture_number
          ]


          print(
              f"Lecture {lecture_number} date: "
              f"{lecture_date}"
          )


          # ==================================================
          # DETERMINE LECTURE STATUS
          # ==================================================

          if today < lecture_date:

              lecture_status = "NOT YET AVAILABLE"

          elif today > lecture_date:

              lecture_status = "AVAILABLE"

          else:

              lecture_status = "RELEASE DAY"


          print(
              f"Lecture status: {lecture_status}"
          )


          # ==================================================
          # DETERMINE RELEASE STAGES
          # ==================================================

          release_slides = (
              today == lecture_date
              and current_time >= slides_time
          )

          release_exercise = (
              today == lecture_date
              and current_time >= exercise_time
          )

          release_solution = (
              today == lecture_date
              and current_time >= solution_time
          )

          release_homework = (
              today == lecture_date
              and current_time >= homework_time
          )


          # ==================================================
          # FUNCTION TO SYNCHRONIZE A FILE
          # ==================================================

          def sync_file(filename):

              source_file = source / filename
              destination_file = destination / filename


              if not source_file.exists():

                  print(
                      f"WARNING: source file does not exist: "
                      f"{filename}"
                  )

                  return


              shutil.copy2(
                  source_file,
                  destination_file
              )


              print(
                  f"SYNCED: {filename}"
              )


          # ==================================================
          # README
          #
          # README IS ALWAYS PUBLIC.
          #
          # We take the README from the private repository
          # and append the temporary availability notice.
          # ==================================================

          private_readme = source / "README.md"
          public_readme = destination / "README.md"


          if not private_readme.exists():

              print(
                  "WARNING: README.md does not exist "
                  "in the private repository."
              )

          else:

              private_readme_text = (
                  private_readme.read_text(
                      encoding="utf-8"
                  )
              )


              # ----------------------------------------------
              # BEFORE RELEASE
              # ----------------------------------------------

              if (
                  today < lecture_date
                  or (
                      today == lecture_date
                      and current_time < slides_time
                  )
              ):

                  availability_message = f"""

---

## Material availability

**Materials not yet available.**

The materials for this lecture will be released on
**{lecture_date.strftime('%d %B %Y')}**
from **{slides_time.strftime('%H:%M')}**
(Berlin time).
"""


              # ----------------------------------------------
              # RELEASE DAY / AFTER RELEASE
              # ----------------------------------------------

              else:

                  availability_message = f"""

---

## Material availability

**Materials available.**
"""


              public_readme.write_text(
                  private_readme_text.rstrip()
                  + availability_message
                  + "\n",
                  encoding="utf-8"
              )


              print("")
              print("==========================================")
              print("README SYNCHRONIZED")
              print("==========================================")
              print(
                  "Private Lecture 13 README has been "
                  "copied to the student repository."
              )
              print("==========================================")


          # ==================================================
          # RELEASE MATERIALS
          # ==================================================

          if today == lecture_date:

              # ----------------------------------------------
              # 23:15
              # ----------------------------------------------

              if release_slides:

                  print("")
                  print(
                      "23:15 release threshold reached."
                  )

                  sync_file(
                      "Lecture13_slides.pdf"
                  )

                  sync_file(
                      "Env_Stat_Lecture13.pdf"
                  )


              # ----------------------------------------------
              # 23:20
              # ----------------------------------------------

              if release_exercise:

                  print("")
                  print(
                      "23:20 release threshold reached."
                  )

                  sync_file(
                      "Exercise_13_Question.ipynb"
                  )

                  sync_file(
                      "diabetes.csv"
                  )


              # ----------------------------------------------
              # 23:25
              # ----------------------------------------------

              if release_solution:

                  print("")
                  print(
                      "23:25 release threshold reached."
                  )

                  sync_file(
                      "Exercise_13_Solution.ipynb"
                  )


              # ----------------------------------------------
              # 23:26
              # ----------------------------------------------

              if release_homework:

                  print("")
                  print(
                      "23:26 release threshold reached."
                  )

                  sync_file(
                      "Homework_13_Question.ipynb"
                  )


          else:

              print("")
              print(
                  "Today is not Lecture 13 release day."
              )

              print(
                  "No scheduled lecture materials released."
              )


          # ==================================================
          # SHOW CURRENT CONTENTS
          # ==================================================

          print("")
          print("==========================================")
          print("CURRENT LECTURE 13 CONTENT")
          print("==========================================")


          for file in sorted(destination.iterdir()):

              if file.is_file():

                  print(file.name)


          print("==========================================")
          print("Release check completed.")
          print("==========================================")


          PY


      # ==================================================
      # 6. Commit changes
      # ==================================================
      - name: Commit changes
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add Lecture-13


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update Lecture 13 materials"

            git push

          fi

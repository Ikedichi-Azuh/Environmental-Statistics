name: Release Course Materials

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-course-materials:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout student repository
      # ==================================================
      - name: Checkout student repository
        uses: actions/checkout@v5


      # ==================================================
      # 2. Set up Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ==================================================
      # 3. Install PyYAML
      # ==================================================
      - name: Install Python dependencies
        run: |
          pip install pyyaml


      # ==================================================
      # 4. Release course materials
      # ==================================================
      - name: Release available materials
        env:
          TZ: Europe/Berlin
          TOKEN: ${{ secrets.LECTURE_REPO_TOKEN }}
        run: |

          python <<'PY'

          import shutil
          import subprocess
          import yaml

          from pathlib import Path
          from datetime import datetime, date, time


          # ==================================================
          # CONFIGURATION
          # ==================================================

          SOURCE_ROOT = Path("lecture-sources")


          # Release times
          SLIDES_TIME = time(8, 45)
          EXERCISE_TIME = time(10, 0)
          SOLUTION_TIME = time(12, 0)
          HOMEWORK_TIME = time(12, 1)


          SOURCE_ROOT.mkdir(
              parents=True,
              exist_ok=True
          )


          # ==================================================
          # CURRENT BERLIN DATE AND TIME
          # ==================================================

          now = datetime.now()

          today = now.date()
          current_time = now.time()


          print("")
          print("==========================================")
          print("COURSE RELEASE CHECK")
          print("==========================================")
          print(f"Berlin date: {today}")
          print(f"Berlin time: {current_time}")
          print("==========================================")


          # ==================================================
          # READ COURSE SCHEDULE
          # ==================================================

          with open(
              "schedule.yml",
              "r",
              encoding="utf-8"
          ) as f:

              schedule = yaml.safe_load(f)


          lectures = schedule["lectures"]


          # ==================================================
          # HELPER: SYNCHRONIZE FILE
          # ==================================================

          def sync_file(
              source,
              destination,
              filename
          ):

              source_file = source / filename
              destination_file = destination / filename


              if not source_file.exists():

                  print(
                      f"WARNING: source file does not exist: "
                      f"{filename}"
                  )

                  return


              shutil.copy2(
                  source_file,
                  destination_file
              )


              print(
                  f"SYNCED: {filename}"
              )


          # ==================================================
          # PROCESS EACH LECTURE
          # ==================================================

          for lecture in lectures:

              lecture_number = int(
                  lecture["number"]
              )

              lecture_date = date.fromisoformat(
                  str(lecture["date"])
              )

              repository = lecture.get(
                  "repository"
              )


              destination = Path(
                  f"Lecture-{lecture_number:02d}"
              )


              destination.mkdir(
                  parents=True,
                  exist_ok=True
              )


              print("")
              print("")
              print("##########################################")
              print(
                  f"LECTURE {lecture_number}"
              )
              print("##########################################")


              print(
                  f"Lecture date: {lecture_date}"
              )


              # ==================================================
              # NO PRIVATE REPOSITORY YET
              # ==================================================

              if not repository:

                  print(
                      "No private repository configured."
                  )

                  print(
                      "README placeholder will be maintained."
                  )

                  continue


              # ==================================================
              # CLONE PRIVATE REPOSITORY
              # ==================================================

              source = (
                  SOURCE_ROOT
                  / f"lecture-{lecture_number:02d}"
              )


              if source.exists():

                  shutil.rmtree(source)


              repo_url = (
                  "https://x-access-token:"
                  f"{__import__('os').environ['TOKEN']}"
                  "@github.com/Ikedichi-Azuh/"
                  f"{repository}.git"
              )


              print(
                  f"Cloning repository: {repository}"
              )


              result = subprocess.run(
                  [
                      "git",
                      "clone",
                      repo_url,
                      str(source)
                  ],
                  capture_output=True,
                  text=True
              )


              if result.returncode != 0:

                  print(
                      "WARNING: private repository "
                      "could not be cloned."
                  )

                  print(
                      "This lecture will be skipped."
                  )

                  print(
                      result.stderr
                  )

                  continue


              print(
                  "Private repository cloned successfully."
              )


              # ==================================================
              # README
              # ==================================================

              private_readme = (
                  source / "README.md"
              )

              public_readme = (
                  destination / "README.md"
              )


              if private_readme.exists():

                  readme_text = (
                      private_readme
                      .read_text(
                          encoding="utf-8"
                      )
                      .rstrip()
                  )


                  readme_text += (
                      "\n\n---\n\n"
                  )

                  readme_text += (
                      "## Material availability\n\n"
                  )


                  # ----------------------------------------------
                  # MATERIALS NOT YET AVAILABLE
                  # ----------------------------------------------

                  if (
                      today < lecture_date
                      or (
                          today == lecture_date
                          and current_time < SLIDES_TIME
                      )
                  ):

                      readme_text += (
                          "**Materials not yet available.**\n\n"
                      )

                      readme_text += (
                          f"Materials will be released on "
                          f"**{lecture_date.strftime('%d %B %Y')}** "
                          f"from **{SLIDES_TIME.strftime('%H:%M')}** "
                          f"(Berlin time).\n"
                      )


                  # ----------------------------------------------
                  # MATERIALS AVAILABLE
                  # ----------------------------------------------

                  else:

                      readme_text += (
                          "**Materials available.**\n"
                      )


                  public_readme.write_text(
                      readme_text + "\n",
                      encoding="utf-8"
                  )


                  print(
                      "README synchronized."
                  )


              else:

                  print(
                      "WARNING: README.md not found."
                  )


              # ==================================================
              # DETERMINE RELEASE STAGES
              #
              # IMPORTANT:
              #
              # If the workflow somehow misses the exact
              # lecture day, everything that should already
              # have been released is still released.
              # ==================================================

              release_slides = (
                  today > lecture_date
                  or (
                      today == lecture_date
                      and current_time >= SLIDES_TIME
                  )
              )


              release_exercise = (
                  today > lecture_date
                  or (
                      today == lecture_date
                      and current_time >= EXERCISE_TIME
                  )
              )


              release_solution = (
                  today > lecture_date
                  or (
                      today == lecture_date
                      and current_time >= SOLUTION_TIME
                  )
              )


              release_homework = (
                  today > lecture_date
                  or (
                      today == lecture_date
                      and current_time >= HOMEWORK_TIME
                  )
              )


              # ==================================================
              # RELEASE MATERIALS
              # ==================================================

              if release_slides:

                  print(
                      "Slides + teaching notes released."
                  )


                  sync_file(
                      source,
                      destination,
                      f"Lecture{lecture_number}_slides.pdf"
                  )


                  sync_file(
                      source,
                      destination,
                      f"Env_Stat_Lecture{lecture_number}.pdf"
                  )


              if release_exercise:

                  print(
                      "Exercise question + data released."
                  )


                  sync_file(
                      source,
                      destination,
                      f"Exercise_{lecture_number}_Question.ipynb"
                  )


                  # Data file is lecture-specific.
                  # If it does not exist, a warning is printed.
                  #
                  # For Lecture 13 this is diabetes.csv.

                  data_files = [
                      file
                      for file in source.iterdir()
                      if file.is_file()
                      and file.suffix.lower()
                      in [".csv", ".xlsx", ".xls"]
                  ]


                  if data_files:

                      for data_file in data_files:

                          sync_file(
                              source,
                              destination,
                              data_file.name
                          )

                  else:

                      print(
                          "No exercise data file found."
                      )


              if release_solution:

                  print(
                      "Exercise solution released."
                  )


                  sync_file(
                      source,
                      destination,
                      f"Exercise_{lecture_number}_Solution.ipynb"
                  )


              if release_homework:

                  print(
                      "Homework question released."
                  )


                  sync_file(
                      source,
                      destination,
                      f"Homework_{lecture_number}_Question.ipynb"
                  )


              # ==================================================
              # SHOW CURRENT CONTENTS
              # ==================================================

              print("")
              print(
                  f"Current Lecture {lecture_number} content:"
              )


              for file in sorted(
                  destination.iterdir()
              ):

                  if file.is_file():

                      print(
                          f"  {file.name}"
                      )


          # ==================================================
          # FINISHED
          # ==================================================

          print("")
          print("==========================================")
          print("ALL LECTURES PROCESSED")
          print("==========================================")
          print("Release check completed.")
          print("==========================================")


          PY


      # ==================================================
      # 5. Commit changes
      # ==================================================
      - name: Commit changes
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add Lecture-*


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Release course materials"

            git push

          fi

name: Release Course Materials

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-lecture-13:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout student repository
      # ==================================================
      - name: Checkout student repository
        uses: actions/checkout@v5


      # ==================================================
      # 2. Clone private Lecture 13 repository
      # ==================================================
      - name: Clone Lecture 13 repository
        env:
          TOKEN: ${{ secrets.LECTURE_REPO_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${TOKEN}@github.com/Ikedichi-Azuh/Environmental-Statistics-Lecture-13-Plotting-and-Variable-importance.git \
            lecture13-source


      # ==================================================
      # 3. Set up Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ==================================================
      # 4. Install PyYAML
      # ==================================================
      - name: Install Python dependencies
        run: |
          pip install pyyaml


      # ==================================================
      # 5. Release materials
      # ==================================================
      - name: Release available materials
        env:
          TZ: Europe/Berlin
        run: |

          python <<'PY'

          import shutil
          import yaml

          from pathlib import Path
          from datetime import datetime, date, time


          # ==================================================
          # CONFIGURATION
          # ==================================================

          lecture_number = 13

          source = Path("lecture13-source")
          destination = Path("Lecture-13")


          destination.mkdir(
              parents=True,
              exist_ok=True
          )


          # ==================================================
          # REAL LECTURE 13 RELEASE TIMES
          #
          # README -> available immediately
          # 08:45 -> slides + teaching notes
          # 10:00 -> exercise question + data
          # 12:00 -> exercise solution
          # 12:01 -> homework question
          # ==================================================

          slides_time = time(8, 45)
          exercise_time = time(10, 0)
          solution_time = time(12, 0)
          homework_time = time(12, 1)


          # ==================================================
          # CURRENT BERLIN DATE AND TIME
          # ==================================================

          now = datetime.now()

          today = now.date()
          current_time = now.time()


          print("")
          print("==========================================")
          print("COURSE RELEASE CHECK")
          print("==========================================")
          print(f"Berlin date: {today}")
          print(f"Berlin time: {current_time}")
          print("==========================================")


          # ==================================================
          # READ COURSE SCHEDULE
          # ==================================================

          with open(
              "schedule.yml",
              "r",
              encoding="utf-8"
          ) as f:

              schedule = yaml.safe_load(f)


          lecture_dates = {
              int(lecture["number"]):
              date.fromisoformat(
                  str(lecture["date"])
              )
              for lecture in schedule["lectures"]
          }


          lecture_date = lecture_dates[
              lecture_number
          ]


          print(
              f"Lecture {lecture_number} date: "
              f"{lecture_date}"
          )


          # ==================================================
          # DETERMINE RELEASE STATUS
          # ==================================================

          if today < lecture_date:

              lecture_status = "NOT YET AVAILABLE"

          elif today > lecture_date:

              lecture_status = "AVAILABLE"

          else:

              lecture_status = "RELEASE DAY"


          print(
              f"Lecture status: {lecture_status}"
          )


          # ==================================================
          # DETERMINE RELEASE STAGES
          # ==================================================

          release_slides = (
              today == lecture_date
              and current_time >= slides_time
          )

          release_exercise = (
              today == lecture_date
              and current_time >= exercise_time
          )

          release_solution = (
              today == lecture_date
              and current_time >= solution_time
          )

          release_homework = (
              today == lecture_date
              and current_time >= homework_time
          )


          # ==================================================
          # SYNCHRONIZE A FILE
          #
          # Existing files WILL be updated if the private
          # version changes.
          # ==================================================

          def sync_file(filename):

              source_file = source / filename
              destination_file = destination / filename


              if not source_file.exists():

                  print(
                      f"WARNING: source file does not exist: "
                      f"{filename}"
                  )

                  return


              shutil.copy2(
                  source_file,
                  destination_file
              )


              print(
                  f"SYNCED: {filename}"
              )


          # ==================================================
          # README
          #
          # The private README is always used as the source.
          #
          # Before 08:45 on Lecture 13 day, or before the
          # lecture date:
          #
          #   private README
          #   +
          #   "Materials not yet available."
          #
          # From 08:45 on Lecture 13 day onward:
          #
          #   private README
          #   +
          #   "Materials available."
          #
          # The private README itself is NEVER modified.
          # ==================================================

          private_readme = source / "README.md"
          public_readme = destination / "README.md"


          if private_readme.exists():

              readme_text = private_readme.read_text(
                  encoding="utf-8"
              ).rstrip()


              readme_text += "\n\n---\n\n"

              readme_text += (
                  "## Material availability\n\n"
              )


              # ----------------------------------------------
              # BEFORE MATERIAL RELEASE
              # ----------------------------------------------

              if (
                  today < lecture_date
                  or (
                      today == lecture_date
                      and current_time < slides_time
                  )
              ):

                  readme_text += (
                      "**Materials not yet available.**\n\n"
                  )

                  readme_text += (
                      f"Materials will be released on "
                      f"**{lecture_date.strftime('%d %B %Y')}** "
                      f"from **{slides_time.strftime('%H:%M')}** "
                      f"(Berlin time).\n"
                  )


              # ----------------------------------------------
              # MATERIALS AVAILABLE
              # ----------------------------------------------

              else:

                  readme_text += (
                      "**Materials available.**\n"
                  )


              public_readme.write_text(
                  readme_text + "\n",
                  encoding="utf-8"
              )


              print("")
              print("==========================================")
              print("README SYNCHRONIZED")
              print("==========================================")

              if (
                  today < lecture_date
                  or (
                      today == lecture_date
                      and current_time < slides_time
                  )
              ):

                  print(
                      "Private README copied."
                  )

                  print(
                      "Status: MATERIALS NOT YET AVAILABLE"
                  )

              else:

                  print(
                      "Private README copied."
                  )

                  print(
                      "Status: MATERIALS AVAILABLE"
                  )

              print("==========================================")


          else:

              print(
                  "WARNING: README.md not found "
                  "in private Lecture 13 repository."
              )


          # ==================================================
          # RELEASE MATERIALS
          # ==================================================

          if today == lecture_date:

              # ----------------------------------------------
              # 08:45
              # Slides + teaching notes
              # ----------------------------------------------

              if release_slides:

                  print("")
                  print(
                      "08:45 release threshold reached."
                  )

                  sync_file(
                      "Lecture13_slides.pdf"
                  )

                  sync_file(
                      "Env_Stat_Lecture13.pdf"
                  )


              # ----------------------------------------------
              # 10:00
              # Exercise question + data
              # ----------------------------------------------

              if release_exercise:

                  print("")
                  print(
                      "10:00 release threshold reached."
                  )

                  sync_file(
                      "Exercise_13_Question.ipynb"
                  )

                  sync_file(
                      "diabetes.csv"
                  )


              # ----------------------------------------------
              # 12:00
              # Exercise solution
              # ----------------------------------------------

              if release_solution:

                  print("")
                  print(
                      "12:00 release threshold reached."
                  )

                  sync_file(
                      "Exercise_13_Solution.ipynb"
                  )


              # ----------------------------------------------
              # 12:01
              # Homework question
              # ----------------------------------------------

              if release_homework:

                  print("")
                  print(
                      "12:01 release threshold reached."
                  )

                  sync_file(
                      "Homework_13_Question.ipynb"
                  )


          else:

              print("")
              print(
                  "Today is not Lecture 13 release day."
              )

              print(
                  "No Lecture 13 materials will be released."
              )


          # ==================================================
          # SHOW CURRENT CONTENTS
          # ==================================================

          print("")
          print("==========================================")
          print("CURRENT LECTURE 13 CONTENT")
          print("==========================================")


          for file in sorted(destination.iterdir()):

              if file.is_file():

                  print(file.name)


          print("==========================================")
          print("Release check completed.")
          print("==========================================")


          PY


      # ==================================================
      # 6. Commit changes
      # ==================================================
      - name: Commit changes
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add Lecture-13


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Release Lecture 13 materials"

            git push

          fi

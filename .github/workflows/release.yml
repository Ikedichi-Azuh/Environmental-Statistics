name: Release Course Materials

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-lecture-13:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout student repository
      # ==================================================
      - name: Checkout student repository
        uses: actions/checkout@v5


      # ==================================================
      # 2. Clone private Lecture 13 repository
      # ==================================================
      - name: Clone Lecture 13 repository
        env:
          TOKEN: ${{ secrets.LECTURE_REPO_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${TOKEN}@github.com/Ikedichi-Azuh/Environmental-Statistics-Lecture-13-Plotting-and-Variable-importance.git \
            lecture13-source


      # ==================================================
      # 3. Set up Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"


      # ==================================================
      # 4. Install PyYAML
      # ==================================================
      - name: Install Python dependencies
        run: |
          pip install pyyaml


      # ==================================================
      # 5. Release materials
      # ==================================================
      - name: Release available materials
        env:
          TZ: Europe/Berlin
        run: |

          python <<'PY'

          import shutil
          import yaml

          from pathlib import Path
          from datetime import datetime, date, time


          # ==================================================
          # CONFIGURATION
          # ==================================================

          lecture_number = 13

          source = Path("lecture13-source")
          destination = Path("Lecture-13")


          destination.mkdir(
              parents=True,
              exist_ok=True
          )


          # ==================================================
          # TEMPORARY TEST RELEASE TIMES
          #
          # 00:02 -> README + slides + teaching notes
          # 00:05 -> exercise question + data
          # 00:06 -> exercise solution
          # 00:07 -> homework question
          # ==================================================

          slides_time = time(00, 02)
          exercise_time = time(00, 05)
          solution_time = time(00, 06)
          homework_time = time(00, 07)


          # ==================================================
          # CURRENT BERLIN DATE AND TIME
          # ==================================================

          now = datetime.now()

          today = now.date()
          current_time = now.time()


          print("")
          print("==========================================")
          print("COURSE RELEASE CHECK")
          print("==========================================")
          print(f"Berlin date: {today}")
          print(f"Berlin time: {current_time}")
          print("==========================================")


          # ==================================================
          # READ COURSE SCHEDULE
          # ==================================================

          with open(
              "schedule.yml",
              "r",
              encoding="utf-8"
          ) as f:

              schedule = yaml.safe_load(f)


          lecture_dates = {
              int(lecture["number"]):
              date.fromisoformat(
                  str(lecture["date"])
              )
              for lecture in schedule["lectures"]
          }


          lecture_date = lecture_dates[
              lecture_number
          ]


          print(
              f"Lecture {lecture_number} date: "
              f"{lecture_date}"
          )


          # ==================================================
          # DETERMINE RELEASE STATUS
          # ==================================================

          if today < lecture_date:

              lecture_status = "NOT YET AVAILABLE"

          elif today > lecture_date:

              lecture_status = "AVAILABLE"

          else:

              lecture_status = "RELEASE DAY"


          print(
              f"Lecture status: {lecture_status}"
          )


          # ==================================================
          # DETERMINE RELEASE STAGES
          # ==================================================

          release_slides = (
              today == lecture_date
              and current_time >= slides_time
          )

          release_exercise = (
              today == lecture_date
              and current_time >= exercise_time
          )

          release_solution = (
              today == lecture_date
              and current_time >= solution_time
          )

          release_homework = (
              today == lecture_date
              and current_time >= homework_time
          )


          # ==================================================
          # SYNCHRONIZE A FILE
          #
          # Unlike the previous version, an existing file
          # WILL be updated if the private version changes.
          # ==================================================

          def sync_file(filename):

              source_file = source / filename
              destination_file = destination / filename


              if not source_file.exists():

                  print(
                      f"WARNING: source file does not exist: "
                      f"{filename}"
                  )

                  return


              shutil.copy2(
                  source_file,
                  destination_file
              )


              print(
                  f"SYNCED: {filename}"
              )


          # ==================================================
          # RELEASE / SYNCHRONIZE MATERIALS
          # ==================================================

          if today == lecture_date:

              # ----------------------------------------------
              # 23:15
              # README + slides + teaching notes
              # ----------------------------------------------

              if release_slides:

                  print("")
                  print(
                      "23:15 release threshold reached."
                  )


                  # IMPORTANT:
                  # The README comes directly from the
                  # private lecture repository.

                  sync_file(
                      "README.md"
                  )

                  sync_file(
                      "Lecture13_slides.pdf"
                  )

                  sync_file(
                      "Env_Stat_Lecture13.pdf"
                  )


              # ----------------------------------------------
              # 23:20
              # Exercise question + data
              # ----------------------------------------------

              if release_exercise:

                  print("")
                  print(
                      "23:20 release threshold reached."
                  )

                  sync_file(
                      "Exercise_13_Question.ipynb"
                  )

                  sync_file(
                      "diabetes.csv"
                  )


              # ----------------------------------------------
              # 23:25
              # Exercise solution
              # ----------------------------------------------

              if release_solution:

                  print("")
                  print(
                      "23:25 release threshold reached."
                  )

                  sync_file(
                      "Exercise_13_Solution.ipynb"
                  )


              # ----------------------------------------------
              # 23:26
              # Homework question
              # ----------------------------------------------

              if release_homework:

                  print("")
                  print(
                      "23:26 release threshold reached."
                  )

                  sync_file(
                      "Homework_13_Question.ipynb"
                  )


          else:

              print("")
              print(
                  "Today is not Lecture 13 release day."
              )

              print(
                  "No Lecture 13 materials will be released."
              )


          # ==================================================
          # BEFORE RELEASE:
          # CREATE TEMPORARY PUBLIC README
          #
          # IMPORTANT:
          # Once the private README has been released,
          # we DO NOT overwrite it with this message.
          # ==================================================

          public_readme = destination / "README.md"


          private_readme_released = (
              public_readme.exists()
              and (
                  today > lecture_date
                  or (
                      today == lecture_date
                      and current_time >= slides_time
                  )
              )
          )


          if not private_readme_released:

              readme = []

              readme.append(
                  f"# Lecture {lecture_number}"
              )

              readme.append("")

              readme.append(
                  "## MATERIAL NOT YET AVAILABLE"
              )

              readme.append("")

              readme.append(
                  f"This lecture will be available on "
                  f"**{lecture_date.strftime('%d %B %Y')}**."
              )

              readme.append("")

              readme.append(
                  f"Materials will be released from "
                  f"**{slides_time.strftime('%H:%M')}** "
                  f"(Berlin time)."
              )

              readme.append("")


              public_readme.write_text(
                  "\n".join(readme) + "\n",
                  encoding="utf-8"
              )


              print("")
              print("==========================================")
              print("TEMPORARY PUBLIC README")
              print("==========================================")
              print(
                  "\n".join(readme)
              )
              print("==========================================")


          else:

              print("")
              print(
                  "Private lecture README is now public."
              )

              print(
                  "It will not be replaced by the "
                  "temporary availability message."
              )


          # ==================================================
          # SHOW CURRENT CONTENTS
          # ==================================================

          print("")
          print("==========================================")
          print("CURRENT LECTURE 13 CONTENT")
          print("==========================================")


          for file in sorted(destination.iterdir()):

              if file.is_file():

                  print(file.name)


          print("==========================================")
          print("Release check completed.")
          print("==========================================")


          PY


      # ==================================================
      # 6. Commit changes
      # ==================================================
      - name: Commit changes
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add Lecture-13


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Release Lecture 13 materials"

            git push

          fi

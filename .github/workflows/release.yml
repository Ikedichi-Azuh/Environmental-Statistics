name: Release Course Materials

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-lecture-13:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout student repository
      # --------------------------------------------------
      - name: Checkout student repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Clone private Lecture 13 repository
      # --------------------------------------------------
      - name: Clone Lecture 13 repository
        env:
          TOKEN: ${{ secrets.LECTURE_REPO_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${TOKEN}@github.com/Ikedichi-Azuh/Environmental-Statistics-Lecture-13-Plotting-and-Variable-importance.git \
            lecture13-source

      # --------------------------------------------------
      # 3. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # --------------------------------------------------
      # 4. Install PyYAML
      # --------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install pyyaml

      # --------------------------------------------------
      # 5. Check availability and release materials
      # --------------------------------------------------
      - name: Release available materials
        env:
          TZ: Europe/Berlin
        run: |

          python <<'PY'

          import shutil
          import yaml

          from pathlib import Path
          from datetime import datetime, date, time


          # ==================================================
          # CONFIGURATION
          # ==================================================

          lecture_number = 13

          source = Path("lecture13-source")
          destination = Path("Lecture-13")

          destination.mkdir(exist_ok=True)


          # ==================================================
          # CURRENT BERLIN DATE AND TIME
          # ==================================================

          now = datetime.now()

          today = now.date()
          current_time = now.time()

          print(f"Berlin date: {today}")
          print(f"Berlin time: {current_time}")


          # ==================================================
          # READ SCHEDULE
          # ==================================================

          with open(
              "schedule.yml",
              "r",
              encoding="utf-8"
          ) as f:

              schedule = yaml.safe_load(f)


          lecture_dates = {
              int(lecture["number"]):
              date.fromisoformat(
                  str(lecture["date"])
              )
              for lecture in schedule["lectures"]
          }


          lecture_date = lecture_dates[
              lecture_number
          ]


          print(
              f"Lecture {lecture_number} date: "
              f"{lecture_date}"
          )


          # ==================================================
          # STATUS README
          # ==================================================

          status_file = destination / "README.md"


          if today < lecture_date:

              status_text = f"""# Lecture {lecture_number}

          ## NOT YET AVAILABLE

          This lecture will be available on **{lecture_date.strftime("%d %B %Y")}**.

          Materials will be released progressively during the lecture day.
          """

              print(
                  f"Lecture {lecture_number} is NOT YET AVAILABLE."
              )


          elif today == lecture_date:

              status_text = f"""# Lecture {lecture_number}

          ## RELEASE DAY

          Materials are being released progressively today
          (**{lecture_date.strftime("%d %B %Y")}**).

          """

              print(
                  f"Lecture {lecture_number} is on its release day."
              )


          else:

              status_text = f"""# Lecture {lecture_number}

          ## AVAILABLE

          This lecture was released on
          **{lecture_date.strftime("%d %B %Y")}**.

          Materials are listed below as they become available.
          """

              print(
                  f"Lecture {lecture_number} is AVAILABLE."
              )


          status_file.write_text(
              status_text,
              encoding="utf-8"
          )


          # ==================================================
          # COPY FUNCTION
          # ==================================================

          def copy_file(filename):

              source_file = source / filename
              destination_file = destination / filename


              if not source_file.exists():

                  print(
                      f"WARNING: {filename} "
                      f"does not exist in source repository."
                  )

                  return


              if destination_file.exists():

                  print(
                      f"Already released: {filename}"
                  )

                  return


              shutil.copy2(
                  source_file,
                  destination_file
              )


              print(
                  f"Released: {filename}"
              )


          # ==================================================
          # RELEASE MATERIALS
          # ==================================================

          if today == lecture_date:

              # ----------------------------------------------
              # 08:45
              # ----------------------------------------------

              if current_time >= time(8, 45):

                  print(
                      "08:45 release threshold reached."
                  )

                  copy_file(
                      "Lecture13_slides.pdf"
                  )

                  copy_file(
                      "Env_Stat_Lecture13.pdf"
                  )


              # ----------------------------------------------
              # 10:00
              # ----------------------------------------------

              if current_time >= time(10, 0):

                  print(
                      "10:00 release threshold reached."
                  )

                  copy_file(
                      "Exercise_13_Question.ipynb"
                  )

                  copy_file(
                      "diabetes.csv"
                  )


              # ----------------------------------------------
              # 12:00
              # ----------------------------------------------

              if current_time >= time(12, 0):

                  print(
                      "12:00 release threshold reached."
                  )

                  copy_file(
                      "Exercise_13_Solution.ipynb"
                  )


              # ----------------------------------------------
              # 12:01
              # ----------------------------------------------

              if current_time >= time(12, 1):

                  print(
                      "12:01 release threshold reached."
                  )

                  copy_file(
                      "Homework_13_Question.ipynb"
                  )


          else:

              print(
                  "No Lecture 13 materials released."
              )


          # ==================================================
          # FINISHED
          # ==================================================

          print("")
          print("Release check completed.")

          PY


      # --------------------------------------------------
      # 6. Show current Lecture 13 contents
      # --------------------------------------------------
      - name: Show Lecture 13 contents
        run: |

          echo "Current Lecture-13 contents:"

          find Lecture-13 \
            -maxdepth 1 \
            -type f \
            -print \
            | sort


      # --------------------------------------------------
      # 7. Commit changes
      # --------------------------------------------------
      - name: Commit released materials
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Lecture-13

          if git diff --cached --quiet; then

            echo "No new changes."

          else

            git commit \
              -m "Update Lecture 13 availability"

            git push

          fi

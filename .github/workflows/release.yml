name: Release Course Materials

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-lecture-13:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout student repository
      # --------------------------------------------------
      - name: Checkout student repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Clone private Lecture 13 repository
      # --------------------------------------------------
      - name: Clone Lecture 13 repository
        env:
          TOKEN: ${{ secrets.LECTURE_REPO_TOKEN }}
        run: |
          git clone \
            https://x-access-token:${TOKEN}@github.com/Ikedichi-Azuh/Environmental-Statistics-Lecture-13-Plotting-and-Variable-importance.git \
            lecture13-source

      # --------------------------------------------------
      # 3. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # --------------------------------------------------
      # 4. Install PyYAML
      # --------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install pyyaml

      # --------------------------------------------------
      # 5. Determine availability and release materials
      # --------------------------------------------------
      - name: Release available materials
        env:
          TZ: Europe/Berlin
        run: |

          python <<'PY'

          import shutil
          import yaml

          from pathlib import Path
          from datetime import datetime, date, time


          # ==================================================
          # CONFIGURATION
          # ==================================================

          lecture_number = 13

          source = Path("lecture13-source")
          destination = Path("Lecture-13")

          destination.mkdir(exist_ok=True)


          # ==================================================
          # TEMPORARY TEST RELEASE TIMES
          #
          # 23:15 -> slides + teaching notes
          # 23:20 -> exercise question + data
          # 23:25 -> exercise solution
          # 23:26 -> homework question
          #
          # THESE ARE ONLY FOR THE CURRENT TEST.
          # They will later be changed back to:
          #
          # 08:45
          # 10:00
          # 12:00
          # 12:01
          # ==================================================
          slides_time = time(23, 15)
          exercise_time = time(23, 20)
          solution_time = time(23, 25)
          homework_time = time(23, 26)


          # ==================================================
          # CURRENT BERLIN DATE AND TIME
          # ==================================================

          now = datetime.now()

          today = now.date()
          current_time = now.time()

          print("")
          print("==========================================")
          print("COURSE RELEASE CHECK")
          print("==========================================")
          print(f"Berlin date: {today}")
          print(f"Berlin time: {current_time}")
          print("==========================================")


          # ==================================================
          # READ COURSE SCHEDULE
          # ==================================================

          with open(
              "schedule.yml",
              "r",
              encoding="utf-8"
          ) as f:

              schedule = yaml.safe_load(f)


          lecture_dates = {
              int(lecture["number"]):
              date.fromisoformat(
                  str(lecture["date"])
              )
              for lecture in schedule["lectures"]
          }


          lecture_date = lecture_dates[
              lecture_number
          ]


          print(
              f"Lecture {lecture_number} date: "
              f"{lecture_date}"
          )


          # ==================================================
          # DETERMINE OVERALL LECTURE STATUS
          # ==================================================

          if today < lecture_date:

              lecture_status = "NOT YET AVAILABLE"

          elif today > lecture_date:

              lecture_status = "AVAILABLE"

          else:

              lecture_status = "RELEASE DAY"


          print(
              f"Lecture status: {lecture_status}"
          )


          # ==================================================
          # DETERMINE WHICH RELEASE STAGES ARE ACTIVE
          # ==================================================

          release_slides = (
              today == lecture_date
              and current_time >= slides_time
          )

          release_exercise = (
              today == lecture_date
              and current_time >= exercise_time
          )

          release_solution = (
              today == lecture_date
              and current_time >= solution_time
          )

          release_homework = (
              today == lecture_date
              and current_time >= homework_time
          )


          # ==================================================
          # FUNCTION TO COPY A FILE
          # ==================================================

          def copy_file(filename):

              source_file = source / filename
              destination_file = destination / filename


              if not source_file.exists():

                  print(
                      f"WARNING: source file does not exist: "
                      f"{filename}"
                  )

                  return


              if destination_file.exists():

                  print(
                      f"Already released: {filename}"
                  )

                  return


              shutil.copy2(
                  source_file,
                  destination_file
              )


              print(
                  f"RELEASED: {filename}"
              )


          # ==================================================
          # RELEASE FILES
          # ==================================================

          if today == lecture_date:

              # ----------------------------------------------
              # 22:47
              # Slides + teaching notes
              # ----------------------------------------------

              if release_slides:

                  print("")
                  print(
                      "22:47 release threshold reached."
                  )

                  copy_file(
                      "Lecture13_slides.pdf"
                  )

                  copy_file(
                      "Env_Stat_Lecture13.pdf"
                  )


              # ----------------------------------------------
              # 22:52
              # Exercise question + data
              # ----------------------------------------------

              if release_exercise:

                  print("")
                  print(
                      "22:52 release threshold reached."
                  )

                  copy_file(
                      "Exercise_13_Question.ipynb"
                  )

                  copy_file(
                      "diabetes.csv"
                  )


              # ----------------------------------------------
              # 22:57
              # Exercise solution
              # ----------------------------------------------

              if release_solution:

                  print("")
                  print(
                      "22:57 release threshold reached."
                  )

                  copy_file(
                      "Exercise_13_Solution.ipynb"
                  )


              # ----------------------------------------------
              # 22:58
              # Homework question
              # ----------------------------------------------

              if release_homework:

                  print("")
                  print(
                      "22:58 release threshold reached."
                  )

                  copy_file(
                      "Homework_13_Question.ipynb"
                  )


          else:

              print("")
              print(
                  "Today is not Lecture 13 release day."
              )

              print(
                  "No Lecture 13 materials will be "
                  "released today."
              )


          # ==================================================
          # CREATE STUDENT-FACING README
          # ==================================================

          readme = []

          readme.append(
              f"# Lecture {lecture_number}"
          )

          readme.append("")


          # --------------------------------------------------
          # NOT YET AVAILABLE
          # --------------------------------------------------

          if today < lecture_date:

              readme.append(
                  "## NOT YET AVAILABLE"
              )

              readme.append("")

              readme.append(
                  f"This lecture will be available on "
                  f"**{lecture_date.strftime('%d %B %Y')}**."
              )

              readme.append("")


          # --------------------------------------------------
          # RELEASE DAY
          # --------------------------------------------------

          elif today == lecture_date:

              readme.append(
                  "## RELEASE DAY"
              )

              readme.append("")

              readme.append(
                  "Materials are being released progressively."
              )

              readme.append("")


          # --------------------------------------------------
          # PAST RELEASE DATE
          # --------------------------------------------------

          else:

              readme.append(
                  "## AVAILABLE"
              )

              readme.append("")


          # ==================================================
          # MATERIAL STATUS
          # ==================================================

          readme.append(
              "## Material availability"
          )

          readme.append("")


          # --------------------------------------------------
          # Lecture slides
          # --------------------------------------------------

          if release_slides or (
              destination / "Lecture13_slides.pdf"
          ).exists():

              readme.append(
                  "- ✅ Lecture slides — **AVAILABLE**"
              )

          else:

              readme.append(
                  f"- ⏳ Lecture slides — "
                  f"available at **{slides_time.strftime('%H:%M')}**"
              )


          # --------------------------------------------------
          # Teaching notes
          # --------------------------------------------------

          if release_slides or (
              destination / "Env_Stat_Lecture13.pdf"
          ).exists():

              readme.append(
                  "- ✅ Teaching notes — **AVAILABLE**"
              )

          else:

              readme.append(
                  f"- ⏳ Teaching notes — "
                  f"available at **{slides_time.strftime('%H:%M')}**"
              )


          # --------------------------------------------------
          # Exercise question
          # --------------------------------------------------

          if release_exercise or (
              destination / "Exercise_13_Question.ipynb"
          ).exists():

              readme.append(
                  "- ✅ Exercise question — **AVAILABLE**"
              )

          else:

              readme.append(
                  f"- ⏳ Exercise question — "
                  f"available at **{exercise_time.strftime('%H:%M')}**"
              )


          # --------------------------------------------------
          # Exercise solution
          # --------------------------------------------------

          if release_solution or (
              destination / "Exercise_13_Solution.ipynb"
          ).exists():

              readme.append(
                  "- ✅ Exercise solution — **AVAILABLE**"
              )

          else:

              readme.append(
                  f"- ⏳ Exercise solution — "
                  f"available at **{solution_time.strftime('%H:%M')}**"
              )


          # --------------------------------------------------
          # Homework question
          # --------------------------------------------------

          if release_homework or (
              destination / "Homework_13_Question.ipynb"
          ).exists():

              readme.append(
                  "- ✅ Homework question — **AVAILABLE**"
              )

          else:

              readme.append(
                  f"- ⏳ Homework question — "
                  f"available at **{homework_time.strftime('%H:%M')}**"
              )


          # ==================================================
          # WRITE README
          # ==================================================

          readme.append("")

          readme.append(
              "Release times are shown in "
              "**Central European Time (Berlin)**."
          )


          status_file = destination / "README.md"

          status_file.write_text(
              "\n".join(readme) + "\n",
              encoding="utf-8"
          )


          print("")
          print("==========================================")
          print("STUDENT-FACING STATUS")
          print("==========================================")
          print(
              "\n".join(readme)
          )
          print("==========================================")


          # ==================================================
          # SHOW CURRENT CONTENTS
          # ==================================================

          print("")
          print("==========================================")
          print("CURRENT Lecture-13 CONTENT")
          print("==========================================")


          for file in sorted(destination.iterdir()):

              if file.is_file():

                  print(file.name)


          print("==========================================")
          print("Release check completed.")
          print("==========================================")


          PY


      # --------------------------------------------------
      # 6. Commit changes
      # --------------------------------------------------
      - name: Commit changes
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Lecture-13

          if git diff --cached --quiet; then

            echo "No new changes to commit."

          else

            git commit \
              -m "Update Lecture 13 materials"

            git push

          fi
